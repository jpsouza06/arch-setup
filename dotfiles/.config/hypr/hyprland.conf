monitor = ,preferred,auto,1
env = QT_QPA_PLATFORMTHEME,qt5ct
source = ~/.config/hypr/colors.conf

$mod = SUPER

$terminal = kitty
$menu = wofi --show drun

exec-once = waybar
exec-once = dunst
exec-once = hyprpolkitagent
exec-once = awww-daemon
exec-once = blueman-applet

input {
	kb_layout = br
	kb_variant = abnt2
	follow_mouse = 1

	touchpad {
	   natural_scroll = false
	}
}

general {
	gaps_in = 5
	gaps_out = 10
	border_size = 2
	col.active_border = $primary
	col.inactive_border = $inactive

	layout = dwindle
}

decoration {
	rounding = 8
	active_opacity = 0.90
	inactive_opacity = 0.85
	fullscreen_opacity = 1.0
}

bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod, B, exec, firefox
bind = $mod, W, exec, waypaper

bind = $mod, SPACE, exec, rofi -show drun

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = , Print, exec, hyprshot -m region -o "$HOME/Pictures/Screenshots"
bind = CTRL, Print, exec, hyprshot -m window -o "$HOME/Pictures/Screenshots"
bind = SHIFT, Print, exec, hyprshot -m output -o "$HOME/Pictures/Screenshots"
